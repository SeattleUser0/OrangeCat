# Orange Cat firmware build on GitHub Actions.
#
# What it does:
#   Hands the build to the community's shared FM-1 builder (zvenson/fm1-build, pinned at its reviewed tag v1).
#   That workflow installs JieLi's Linux toolchain and the AC79 SDK (tag AC79NN_SDK_V1.2.1_2023-12-13) on GitHub's
#   Linux x86-64 runner, runs our build command, then our test command, and uploads the .fwsc package.
#
# When it runs:
#   - A push to main, or Actions > build > Run workflow: a development package (build/orangecat-0.1.0-<commit>.fwsc,
#     version string dev-<commit> on the device), downloadable from the run page as the "packages" artifact.
#     A push to main also publishes the web installer (with this build) and the web editor to GitHub Pages
#     (job pages): https://seattleuser0.github.io/OrangeCat/ once Settings > Pages > Source is "GitHub Actions".
#   - A push of a version tag vX.Y[.Z]: a release package (build/orangecat-X.Y[.Z].fwsc), published as a GitHub Release.
#   The build itself still writes Melodee's file names (build/melodee-*.fwsc); the build step copies the package to
#   the Orange Cat name, and only that copy is published.
#
# The host tests (tests/run_tests.sh) run after the build. Failures are shown on the run page but do not hold the
# package back (tests-block: false), so a build can still be installed and tried while tests are being fixed.
#
# Build options are Melodee 1.4.5's release settings (its .github/workflows/release.yml): dual core required, no
# single-core fallback in shipped builds, audio code in RAM, cache RAM used, admission and profiling off.
#
# Revisions:
#   Rev 7: the failed tests' summary list first in the run page's annotation.
#   Rev 6: engine switches in tools/orangecat_engines.sh (SID and CZ-1 off), read by the build and the test step.
#   Rev 5 (build doc phase 3): the firmware is built with MELODEE_SID=0 (the SID engine unhooked); tests keep the
#         defaults.
#   Rev 4: the pages job passes version 0.1.0 (the installer's release list needs X.Y.Z; with the commit it failed);
#         70 lines of the size report on the run page.
#   Rev 3 (build doc phase 3): size report by engine and area (tools/size_report.py), on the run page and in the
#         packages artifact.
#   Rev 2 (Orange Cat 0.1.0, the rename): packages named orangecat-*.fwsc; the pages job (tools/orangecat_site.py).
#   Rev 1 (Orange Cat build doc phase 1): first version. Replaces Melodee's nightly.yml and release.yml (still in the
#         upstream history). Builds Melodee 1.4.5 unchanged; names stay "melodee" until the rename step of phase 1.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write          # the release on a tag push
      id-token: write          # build provenance attestation
      attestations: write
    with:
      sdk: true
      tests-block: false
      build: |
        set -euo pipefail
        # Melodee 1.4.5 release build options (see the header)
        export PARALLEL=2 MELODEE_DUAL_CORE=1 MELODEE_CORE1_FALLBACK=0
        export MELODEE_RAM_AUDIO=1 MELODEE_CACHE_RAM=1 MELODEE_ADMISSION=0
        export MELODEE_AUDIO_PROFILE=0 MELODEE_AUDIO_BENCH=0
        # (rev 5, build doc phase 3) Melodee's engines unhooked from the firmware, one switch per engine (core.h).
        # (rev 6) the switches live in tools/orangecat_engines.sh, read by this step and the test step.
        . tools/orangecat_engines.sh
        # Pillow needs Raqm (HarfBuzz, FriBidi) for the UI font's OpenType features; mido for the MIDI tools
        sudo apt-get update
        sudo apt-get install -y libharfbuzz-dev libfribidi-dev libraqm-dev
        python3 -m pip install fonttools mido
        # The SDK commit Melodee's releases are built against
        test "$(git -C "$AC79_SDK" rev-parse HEAD)" = d179b4484759423312073f5fbb232501aa491047
        if [ "$GITHUB_REF_TYPE" = tag ]; then mode="--release ${GITHUB_REF_NAME#v}"; else mode="--nightly"; fi
        ok=0; ./build.sh $mode > build.log 2>&1 || ok=1
        # Sizes and checks to the run page (annotations), whether the build passed or not
        note=$(grep -E "^ *(ok|FAIL) |^(app|loader|package|release) |^stub:|error|overflow" build.log | tail -40 \
               | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' || true)
        echo "::notice title=build sizes and checks::$note"
        if [ "$ok" != 0 ]; then
          msg=$(tail -80 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' || true)
          echo "::error title=build failed::$msg"
          exit 1
        fi
        # (rev 3) what the image is made of, by engine and area (tools/size_report.py): the run page, and
        # build/orangecat-size-report.txt in the packages artifact
        rep=$(python3 tools/size_report.py "$JIELI_TOOLCHAIN/common/bin/objdump" build/melodee.elf build/orangecat-size-report.txt \
              | head -70 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' || true)
        echo "::notice title=size by engine and area::$rep"
        # (rev 2) the package under Orange Cat's name: orangecat-X.Y[.Z].fwsc (tag) or orangecat-0.1.0-<commit>.fwsc
        if [ "$GITHUB_REF_TYPE" = tag ]; then
          cp "build/melodee-${GITHUB_REF_NAME#v}.fwsc" "build/orangecat-${GITHUB_REF_NAME#v}.fwsc"
        else
          cp build/melodee-nightly.fwsc "build/orangecat-0.1.0-${GITHUB_SHA::7}.fwsc"
        fi
      test: |
        set -euo pipefail
        export PARALLEL=2 MELODEE_DUAL_CORE=1 MELODEE_CORE1_FALLBACK=0
        export MELODEE_RAM_AUDIO=1 MELODEE_CACHE_RAM=1 MELODEE_ADMISSION=0
        export MELODEE_AUDIO_PROFILE=0 MELODEE_AUDIO_BENCH=0
        . tools/orangecat_engines.sh       # (rev 6) the target checks skip the render loops of unhooked engines
        # the tests look for build/melodee.fwsc; a nightly or release build names it differently
        [ -f build/melodee.fwsc ] || cp "$(ls build/melodee-*.fwsc | head -1)" build/melodee.fwsc
        ok=0; tests/run_tests.sh > test.log 2>&1 || ok=1
        if [ "$ok" != 0 ]; then
          # (rev 7) the summary's list of failed steps first (it can be cut off at the end of a long message)
          msg=$( { awk '/HOST TESTS .*FAILED/{f=1} f' test.log | head -40; echo ----; grep -inE "FAIL|abort|segmentation|assert|traceback|exception" test.log | grep -vE " ok$|0 fail|0 FAIL" | head -30; } \
                 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' || true)
          echo "::error title=tests failed::$msg"
          exit 1
        fi
      packages: build/orangecat-*

  pages:                                         # (rev 2) the installer with this build, and the editor, on GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: pkg
      - name: The site
        run: python3 tools/orangecat_site.py "$(ls pkg/build/orangecat-*.fwsc | head -1)" 0.1.0 site   # (rev 4) the installer needs X.Y.Z
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
