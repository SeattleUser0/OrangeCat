# Orange Cat firmware build on GitHub Actions.
#
# What it does:
#   Hands the build to the community's shared FM-1 builder (zvenson/fm1-build, pinned at its reviewed tag v1).
#   That workflow installs JieLi's Linux toolchain and the AC79 SDK (tag AC79NN_SDK_V1.2.1_2023-12-13) on GitHub's
#   Linux x86-64 runner, runs our build command, then our test command, and uploads the .fwsc package.
#
# When it runs:
#   - A push to main, or Actions > build > Run workflow: a development package (build/orangecat-0.1.0-<commit>.fwsc,
#     version string dev-<commit> on the device), downloadable from the run page as the "packages" artifact.
#     A push to main also publishes the web installer (with this build) and the web editor to GitHub Pages
#     (job pages): https://seattleuser0.github.io/OrangeCat/ once Settings > Pages > Source is "GitHub Actions".
#   - A push of a version tag vX.Y[.Z]: a release package (build/orangecat-X.Y[.Z].fwsc), published as a GitHub Release.
#   The build itself still writes Melodee's file names (build/melodee-*.fwsc); the build step copies the package to
#   the Orange Cat name, and only that copy is published.
#
# The host tests (tests/run_tests.sh) run after the build, and a failing test turns the run red (rev 14). The shared
# builder cannot do that and keep the package: its package upload runs only after a test step that did not fail, and
# its tests-block input only chooses between "the job stops there, nothing is uploaded" (true) and "the failure is
# ignored" (false). So the two jobs below split the work:
#   - build: on a branch or a manual run tests-block is false, so the shared job always goes on to upload the "packages"
#     artifact. When the host tests fail, the test command (below) still writes the failed tests' summary to the run page
#     as an error annotation (as before) and also to build/orangecat-tests-failed.txt, which travels in the artifact.
#   - tests-gate: reads that file from the artifact and fails the run when it is there. The run page then shows the
#     failure, and the packages artifact is still there, so a build can be tried while a test is being fixed.
#   On a version tag tests-block is true: a failing test stops the job before anything is attested, uploaded or released
#   (AGENTS.md: host and web tests are blocking for a release). The pages job waits for tests-gate, so a build whose
#   tests failed is not published as the installer.
#
# Build options are Melodee 1.4.5's release settings (its .github/workflows/release.yml): dual core required, no
# single-core fallback in shipped builds, audio code in RAM, cache RAM used, admission and profiling off.
#
# Revisions:
#   Rev 16 (Orange Cat 0.13.5): the gate needs a positive marker. tests/run_tests.sh writes build/orangecat-tests-passed.txt ("PASSED <n> jobs ...") as its last act; tools/ci_gate.sh (job
#     tests-gate, now with a checkout) is red when the failed marker is there OR when neither marker is. Before, a test step that died before the tests started (the engine switch
#     file, the fwsc copy, a cancelled step) left no file and the gate passed a run in which no test ran. The test step also writes the failed marker from an EXIT trap when it
#     ends non-zero without one, and a .ci_quick run writes build/orangecat-tests-skipped.txt (the gate passes it with a warning).
#   Rev 15 (Orange Cat 0.13.3): build/orangecat-*.set.json, the set manifests for the card (tools/oc_manifest.py --set), join the packages artifact.
#   Rev 14 (Orange Cat 0.13.2): failing host tests fail the run (job tests-gate; build/orangecat-tests-failed.txt in the artifact); tests-block is true on a tag; pages waits for the gate; the artifact stays on a branch run.
#   Rev 13 (Orange Cat 0.12.1): the Prophet module (tools/build.py --module prophet, 8 sectors, starts 0 and 4) is built beside SHAPES; its .ocm joins the packages and the site.
#   Rev 12 (Orange Cat 0.11.2): build/orangecat-*.manifest.json (tools/oc_manifest.py); the pages job gives the site the pack and the modules with the firmware.
#   Rev 11 (Orange Cat 0.10.0): the module build and its checks (tools/build.py --module) after the build; the .ocm joins the packages.
#   Rev 10 (Orange Cat 0.8.0): the asset pack (build/orangecat-<name>.pak, tools/gen_pack.py) joins the packages artifact.
#   Rev 9 (Orange Cat 0.6.0): the target budget's lines (tests/target_budget.py) to the run page as a notice.
#   Rev 7: the failed tests' summary list first in the run page's annotation.
#   Rev 6: engine switches in tools/orangecat_engines.sh (SID and CZ-1 off), read by the build and the test step.
#   Rev 5 (build doc phase 3): the firmware is built with MELODEE_SID=0 (the SID engine unhooked); tests keep the
#         defaults.
#   Rev 8 (Orange Cat 0.4.9): the version comes from the VERSION file (was 0.1.0 written here): the package name, the
#     installer page's release number, and (tools/build.py) ABOUT and the editor.
#   Rev 4: the pages job passes version 0.1.0 (the installer's release list needs X.Y.Z; with the commit it failed);
#         70 lines of the size report on the run page.
#   Rev 3 (build doc phase 3): size report by engine and area (tools/size_report.py), on the run page and in the
#         packages artifact.
#   Rev 2 (Orange Cat 0.1.0, the rename): packages named orangecat-*.fwsc; the pages job (tools/orangecat_site.py).
#   Rev 1 (Orange Cat build doc phase 1): first version. Replaces Melodee's nightly.yml and release.yml (still in the
#         upstream history). Builds Melodee 1.4.5 unchanged; names stay "melodee" until the rename step of phase 1.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write          # the release on a tag push
      id-token: write          # build provenance attestation
      attestations: write
    with:
      sdk: true
      tests-block: ${{ github.ref_type == 'tag' }}   # (rev 14) false on a branch: the package is still uploaded, and tests-gate fails the run
      build: |
        set -euo pipefail
        # Melodee 1.4.5 release build options (see the header)
        export PARALLEL=2 MELODEE_DUAL_CORE=1 MELODEE_CORE1_FALLBACK=0
        export MELODEE_RAM_AUDIO=1 MELODEE_CACHE_RAM=1 MELODEE_ADMISSION=0
        export MELODEE_AUDIO_PROFILE=0 MELODEE_AUDIO_BENCH=0
        # (rev 5, build doc phase 3) Melodee's engines unhooked from the firmware, one switch per engine (core.h).
        # (rev 6) the switches live in tools/orangecat_engines.sh, read by this step and the test step.
        . tools/orangecat_engines.sh
        # Pillow needs Raqm (HarfBuzz, FriBidi) for the UI font's OpenType features; mido for the MIDI tools
        sudo apt-get update
        sudo apt-get install -y libharfbuzz-dev libfribidi-dev libraqm-dev
        python3 -m pip install fonttools mido
        # The SDK commit Melodee's releases are built against
        test "$(git -C "$AC79_SDK" rev-parse HEAD)" = d179b4484759423312073f5fbb232501aa491047
        if [ "$GITHUB_REF_TYPE" = tag ]; then mode="--release ${GITHUB_REF_NAME#v}"; else mode="--nightly"; fi
        ok=0; ./build.sh $mode > build.log 2>&1 || ok=1
        # Sizes and checks to the run page (annotations), whether the build passed or not
        note=$(grep -E "^ *(ok|FAIL) |^(app|loader|package|release) |^stub:|error|overflow" build.log | tail -40 \
               | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' || true)
        echo "::notice title=build sizes and checks::$note"
        if [ "$ok" != 0 ]; then
          msg=$(tail -80 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' || true)
          echo "::error title=build failed::$msg"
          exit 1
        fi
        # (rev 11, Orange Cat 0.10.0) SHAPES as a loadable module (tools/build.py --module shapes): one image for each start of the
        # module area, no .data / .bss, no undefined symbol; build/shapes-<version>.ocm. The report as a notice.
        # (rev 13, Orange Cat 0.12.1) and the Prophet (--module prophet): 8 sectors, starts 0 and 4; build/prophet-<version>.ocm
        modfail=0
        for m in shapes prophet; do
          modok=0; python3 tools/build.py --module $m > build/module-report-$m.txt 2>&1 || modok=1
          echo "::notice title=module $m::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' build/module-report-$m.txt)"
          if [ "$modok" != 0 ]; then echo "::error title=module build failed::see the module $m notice"; modfail=1; fi
        done
        if [ "$modfail" != 0 ]; then exit 1; fi
        # (rev 3) what the image is made of, by engine and area (tools/size_report.py): the run page, and
        # build/orangecat-size-report.txt in the packages artifact
        rep=$(python3 tools/size_report.py "$JIELI_TOOLCHAIN/common/bin/objdump" build/melodee.elf build/orangecat-size-report.txt \
              | head -70 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' || true)
        echo "::notice title=size by engine and area::$rep"
        # (gui-slim, temporary) the image by source file (tools/size_by_file.py) and every symbol of the UI's files, as
        # notices (the packages artifact cannot be fetched from where the GUI size work runs)
        "$JIELI_TOOLCHAIN/common/bin/objdump" -t build/melodee.elf > build/syms_all.txt
        python3 tools/size_by_file.py build/syms_all.txt firmware/src build/gen --notices 3 || true
        python3 tools/size_by_file.py build/syms_all.txt firmware/src build/gen --notices 5 \
          --detail '^(gfx|ui|icons|lcd|screen|browse|params)' || true
        # (rev 2) the package under Orange Cat's name: orangecat-X.Y[.Z].fwsc (tag) or orangecat-0.1.0-<commit>.fwsc
        if [ "$GITHUB_REF_TYPE" = tag ]; then
          cp "build/melodee-${GITHUB_REF_NAME#v}.fwsc" "build/orangecat-${GITHUB_REF_NAME#v}.fwsc"
        else
          cp build/melodee-nightly.fwsc "build/orangecat-$(tr -d '[:space:]' < VERSION)-${GITHUB_SHA::7}.fwsc"
        fi
        # (rev 10, Orange Cat 0.8.0) the asset pack of this build, tools/gen_pack.py: orangecat-<same name>.pak, in the packages
        # artifact; the firmware reads SHAPES' and MACRO's tables from it (firmware/src/oc_pack.h)
        if [ -f build/melodee.pak ]; then
          if [ "$GITHUB_REF_TYPE" = tag ]; then cp build/melodee.pak "build/orangecat-${GITHUB_REF_NAME#v}.pak"
          else cp build/melodee.pak "build/orangecat-$(tr -d '[:space:]' < VERSION)-${GITHUB_SHA::7}.pak"; fi
        fi
        # (rev 11) the module package: orangecat-shapes-<version>-<commit>.ocm; (rev 13) and the Prophet's
        for m in shapes prophet; do
          if [ -f build/$m-"$(tr -d '[:space:]' < VERSION)".ocm ]; then
            cp build/$m-"$(tr -d '[:space:]' < VERSION)".ocm "build/orangecat-$m-$(tr -d '[:space:]' < VERSION)-${GITHUB_SHA::7}.ocm"
          fi
        done
        # (rev 12, Orange Cat 0.11.2) what the firmware was compiled with (pack hash and length, interface identifier): the pages job checks the pack and the
        # modules against it before the installer offers them with the firmware (tools/oc_manifest.py)
        python3 tools/oc_manifest.py "build/orangecat-$(tr -d '[:space:]' < VERSION)-${GITHUB_SHA::7}.manifest.json"
        # (rev 15, Orange Cat 0.13.3) the sets for the card (docs/orangecat/SET_FORMAT.md): one manifest per module choice, naming this run's files; they go in
        # the packages artifact beside the files, and the unit's file browser lists them as "Set" (Install set: the pack, then the module)
        pk=$(ls build/orangecat-*.pak | head -1); base=$(basename "$pk" .pak); fw=$(ls build/orangecat-*.fwsc | head -1)
        python3 tools/oc_manifest.py --set "build/$base.pack.set.json" --pak "$base.pak" --fwsc "$(basename "$fw")"
        for m in shapes prophet; do
          ocm=$(ls build/orangecat-$m-*.ocm 2>/dev/null | head -1)
          if [ -n "$ocm" ]; then python3 tools/oc_manifest.py --set "build/$base.$m.set.json" --pak "$base.pak" --fwsc "$(basename "$fw")" --ocm "$(basename "$ocm")"; fi
        done
      test: |
        set -euo pipefail
        # (rev 16, Orange Cat 0.13.5) the step ends non-zero without having reported (a source that fails, a copy that fails): say so in the failed marker. The gate
        # (tools/ci_gate.sh) is red with no marker at all as well, for the cases a trap cannot catch (the step killed or cancelled).
        mkdir -p build
        trap 'rc=$?; if [ "$rc" -ne 0 ] && [ ! -f build/orangecat-tests-failed.txt ]; then echo "the test step ended with status $rc before the host tests reported (see the run log)" > build/orangecat-tests-failed.txt; fi' EXIT
        # (gui-slim, temporary) an experiment branch with .ci_quick: the build and its sizes only, no host tests
        if [ -f .ci_quick ]; then echo "quick: no host tests"; echo "quick: .ci_quick is in the repository, so no host test ran (sizes only)" > build/orangecat-tests-skipped.txt; exit 0; fi
        export PARALLEL=2 MELODEE_DUAL_CORE=1 MELODEE_CORE1_FALLBACK=0
        export MELODEE_RAM_AUDIO=1 MELODEE_CACHE_RAM=1 MELODEE_ADMISSION=0
        export MELODEE_AUDIO_PROFILE=0 MELODEE_AUDIO_BENCH=0
        . tools/orangecat_engines.sh       # (rev 6) the target checks skip the render loops of unhooked engines
        # the tests look for build/melodee.fwsc; a nightly or release build names it differently
        [ -f build/melodee.fwsc ] || cp "$(ls build/melodee-*.fwsc | head -1)" build/melodee.fwsc
        ok=0; tests/run_tests.sh > test.log 2>&1 || ok=1
        # (rev 9, Orange Cat 0.6.0) the render loops' target cost, every line, to the run page (the new effects' budgets
        # are taken from it)
        tb=$(python3 tests/target_budget.py build/melodee.dis tests/target_budget.txt 2>&1 | grep -E "^target: " | cut -c9- \
             | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' || true)
        echo "::notice title=target budget::$tb"
        if [ "$ok" != 0 ]; then
          # (rev 7) the summary's list of failed steps first (it can be cut off at the end of a long message)
          plain=$( { awk '/HOST TESTS .*FAILED/{f=1} f' test.log | head -40; echo ----; grep -inE "FAIL|abort|segmentation|assert|traceback|exception" test.log | grep -vE " ok$|0 fail|0 FAIL" | head -30; } || true )
          # (rev 14) the same text, and the log's last lines, in the packages artifact: tests-gate reads it and fails the run. The
          # shared builder goes on to upload the packages only because tests-block is false on a branch (continue-on-error).
          { printf '%s\n' "$plain"; echo "---- the last 150 lines of the test log"; tail -n 150 test.log; } > build/orangecat-tests-failed.txt
          msg=$(printf '%s' "$plain" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' || true)
          echo "::error title=tests failed::$msg"
          exit 1
        fi
      packages: build/orangecat-*

  tests-gate:                                    # (rev 14) the run is red when the host tests failed; the packages artifact is still there. (rev 16) And when no test ran.
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ci_gate.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: pkg
      - name: Host tests
        shell: bash
        run: sh tools/ci_gate.sh pkg

  pages:                                         # (rev 2) the installer with this build, and the editor, on GitHub Pages
    needs: [build, tests-gate]                   # (rev 14) not published when the host tests failed
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: pkg
      - name: The site
        run: python3 tools/orangecat_site.py "$(ls pkg/build/orangecat-*.fwsc | head -1)" "$(tr -d '[:space:]' < VERSION)" site \
            --pak "$(ls pkg/build/orangecat-*.pak | head -1)" --manifest "$(ls pkg/build/orangecat-*.manifest.json | head -1)" \
            $(for f in pkg/build/orangecat-*.ocm; do echo "--ocm $f"; done)   # (rev 8) VERSION, X.Y.Z; (rev 12) the pack and the modules of the build, checked against the manifest
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
